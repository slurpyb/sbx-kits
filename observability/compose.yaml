services:
  dashboard:
    build: .
    restart: unless-stopped
    environment:
      PORT: "8000"
      OBSERVABILITY_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - agent-observability-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8000/healthcheck');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  agent-observability-data:
