schemaVersion: "2"
kind: mixin
name: agy-cli
displayName: Antigravity CLI workstation
description: Replaces Docker Sandbox's built-in Gemini CLI launcher with Google Antigravity CLI (agy) and adds ACP, SSH signing, AstroNvim, VS Code server, browser automation, service CLIs, and web/Python/Liquid/TypeScript tooling.

requires:
  agent: gemini

agentInstructions:
  content: |
    ## Docker Sandbox workstation

    You are inside a Docker Sandbox, not on the host. `sudo` needs no password, and everything you install lasts only as long as this sandbox.

    Default model `gemini-3.1-pro-high` at `high` effort. ACP runs through `agy-acp` 0.5.2, an unofficial PTY/database bridge standing in until agy ships native ACP — pin it, expect it to break on agy upgrades, and switch to native ACP once it exists.

    ### Credentials are sentinels

    Credential variables hold **sentinel** placeholders, not secrets. Use them as ordinary environment variables and let the sandbox proxy swap the real value in for approved hosts. Keep each sentinel inside the process that reads it: pass the variable, and let a failed call fail. Never echo, log, commit, or paste one into an interactive login.

    The built-in Gemini agent supplies `GEMINI_API_KEY` and `GH_TOKEN`. This kit adds `OUTLINE_API_TOKEN`, `LINEAR_API_KEY`, `SHOPIFY_CLI_THEME_TOKEN`, `TUNNEL_TOKEN`, `FIRECRAWL_API_KEY`, `JINA_API_KEY`, and `PERPLEXITY_API_KEY`.

    ### A 403 is a policy rule, not a bug

    Egress is allowlisted. Read the response body of any 403: it names the rule and the reason. This kit adds no deny rules, so a block means the host is absent from the allowlist or org governance is overriding it. Give the user the exact host — they run `sbx policy log` to confirm and `sbx policy allow network <host>` to fix it. Treat the block as final for this session: mirrors, retries, and alternate ports hit the same proxy.

    ### Installed on top of the base agent

    Reach for these by name; they are not in the base image.

    - `ol` Outline · `lin` Linear · `pplx` Perplexity · `firecrawl` · `jina` — each needs its token below, and some need a one-time `login`/`init` before first use.
    - `shopify` Shopify CLI; the Liquid language server is `shopify theme language-server`.
    - `cloudflared` for tunnels. `openspec`. `codemap`.
    - `octocode` — code research across GitHub, this workspace, and npm, with LSP-backed semantic
      queries. Reach for it when a question spans repositories that are not checked out here. Run
      `octocode context --minimal` for its tool list and protocol, then `octocode tools <name> --scheme`
      before composing a query: the schemas are exact and an invented field name is rejected outright.
      It already authenticates from `GH_TOKEN`, so leave `octocode login` alone — device-flow sign-in
      cannot complete against a proxy-managed sentinel.
    - `agent-os-project-install` — cd into a project and run it to install Builder Methods Agent OS there. Clone lives at `/home/agent/agent-os`; `agent-os-sync-to-profile` and `agent-os-common-functions` are alongside it.
    - `playwright` is not installed by default, because the CLI plus a Chromium build costs minutes of
      create time that most tasks never use. When a task genuinely needs a browser, add both:
      `sudo bun install -g --trust playwright@1.61.1 && playwright install --with-deps chromium`.
      The browser lands in `~/.cache/ms-playwright`.
    - `nvim` with AstroNvim.
    - Node 24, `bun`/`bunx`, `typescript-language-server`, `pyright-langserver`.

    ### Git signing

    Commits and tags sign automatically with the forwarded host SSH key, and GitHub host keys are preloaded. When signing fails the cause is almost always the agent forward, so check `SSH_AUTH_SOCK` and `ssh-add -L` first and report what you find. The signing config is set system-wide and correct; leave it as it is.

    ### Observability

    Hooks stream model invocations, tool activity, stop reasons, and transcript deltas to `AGENT_OBSERVABILITY_URL` (default `http://host.docker.internal:8000`), buffering to `/home/agent/logs/<session-id>/events.jsonl` whenever it is unreachable. Capture is off unless `/home/agent/.agent-observe-enabled` exists: without that file the hooks exit before any network or disk write. Create it to turn capture on, delete it to stop.

    ### Project-triggered MCP servers

    Check the project root once, before starting substantive work, and register what matches. Run `agy mcp list` first and add only what is missing.

    - `astro.config.*` present → `agy mcp add astro-docs https://mcp.docs.astro.build/mcp`
    - `shopify.app.toml`, or `sections/` beside `templates/` → `agy mcp add shopify-dev npx -y @shopify/dev-mcp@1.14.6`
    - `panda.config.*` present → `agy mcp add panda npx -y @pandacss/mcp@1.12.0`
permissions:
  network:
    allow:
      - generativelanguage.googleapis.com
      - accounts.google.com
      - oauth2.googleapis.com
      - antigravity.google
      - antigravity-cli-auto-updater-974169037036.us-central1.run.app
      - api.github.com
      - github.com
      - github.com:22
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - codeload.github.com
      - release-assets.githubusercontent.com
      - registry.npmjs.org
      - pypi.org
      - files.pythonhosted.org
      - nodejs.org
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      - storage.googleapis.com
      - api.linear.app
      - api.firecrawl.dev
      - api.jina.ai
      - r.jina.ai
      - api.perplexity.ai
      - mcp.docs.astro.build
      - shopify.dev
      - partners.shopify.com
      - accounts.shopify.com
      - admin.shopify.com
      - myshopify.com
      - "*.myshopify.com"
      - cloudflare.com
      - api.cloudflare.com
      - host.docker.internal:8000

credentials:
  - service: outline
    description: Outline knowledge-base API token. Kept as a real environment value because the Outline host is user-configurable.
    apiKey:
      name: OUTLINE_API_TOKEN
  - service: linear
    description: Linear API token for lin.
    apiKey:
      name: LINEAR_API_KEY
  - service: shopify
    description: Shopify CLI token for non-interactive partner operations.
    apiKey:
      name: SHOPIFY_CLI_THEME_TOKEN
  - service: cloudflare
    description: Cloudflare Tunnel token for non-interactive cloudflared runs.
    apiKey:
      name: TUNNEL_TOKEN
  - service: firecrawl
    description: Firecrawl API token.
    apiKey:
      name: FIRECRAWL_API_KEY
      proxyManaged: true
      inject:
        - domain: api.firecrawl.dev
          header: Authorization
          scheme: bearer
  - service: jina
    description: Jina AI API token.
    apiKey:
      name: JINA_API_KEY
  - service: perplexity
    description: Perplexity API token for pplx.
    apiKey:
      name: PERPLEXITY_API_KEY
      proxyManaged: true
      inject:
        - domain: api.perplexity.ai
          header: Authorization
          scheme: bearer

environment:
  variables:
    EDITOR: nvim
    VISUAL: nvim
    FNM_DIR: /opt/fnm
    BUN_INSTALL: /opt/bun
    AGY_BIN: /home/agent/.local/bin/agy-default
    AGENT_OBSERVABILITY_URL: http://host.docker.internal:8000
    NODE_PATH: /usr/local/lib/node_modules

ports:

setup:
  install:
    - description: Ensure base tools are present and trust GitHub's SSH host keys.
      user: "0"
      command: |
        set -eu
        # Only touch apt when something is genuinely absent: apt-get update
        # refreshes every source in sources.list.d, Docker's included, and that
        # refresh is the cost, not the packages.
        need=""
        for pkg in curl git jq python3 unzip; do
          command -v "$pkg" >/dev/null || need="$need $pkg"
        done
        command -v rg >/dev/null || need="$need ripgrep"
        # agy-acp pulls node-pty, a native addon with no prebuild for every
        # platform, so this kit is the one that still needs a compiler.
        command -v cc >/dev/null || need="$need build-essential"
        if [ -n "$need" ]; then
          attempt=0
          until apt-get update -qq; do attempt=$((attempt + 1)); [ "$attempt" -lt 240 ]; sleep 0.5; done
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $need
          rm -rf /var/lib/apt/lists/*
        fi
        install -d -m 0700 -o agent -g agent /home/agent/.ssh
        curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > /home/agent/.ssh/known_hosts
        chmod 0644 /home/agent/.ssh/known_hosts
        chown agent:agent /home/agent/.ssh/known_hosts
    - description: Install pinned fnm and Node.js 24 system-wide.
      user: "0"
      command: |
        set -eu
        arch=$(dpkg --print-architecture)
        case "$arch" in
          amd64) asset=fnm-linux.zip; sha=7807664f39d39fc518da1c35ba0181e4b3267603c4b1dedeb4b5fc6ae440a224 ;;
          arm64) asset=fnm-arm64.zip; sha=4eaff58b2c5bf30d0934027572dd0b5bbb60d2a1af309230b53662d4b1d45599 ;;
          *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/Schniz/fnm/releases/download/v1.39.0/$asset" -o /tmp/fnm.zip
        echo "$sha  /tmp/fnm.zip" | sha256sum -c -
        unzip -q /tmp/fnm.zip -d /tmp/fnm
        install -m 0755 /tmp/fnm/fnm /usr/local/bin/fnm
        install -d -m 0755 /opt/fnm
        FNM_DIR=/opt/fnm fnm install 24
        FNM_DIR=/opt/fnm fnm default 24
        node_bin=$(FNM_DIR=/opt/fnm fnm exec --using=24 node -p 'require("path").dirname(process.execPath)')
        for bin in node npm npx corepack; do ln -sf "$node_bin/$bin" "/usr/local/bin/$bin"; done
        cat > /etc/profile.d/fnm.sh <<'EOF'
        export FNM_DIR=/opt/fnm
        export PATH="/usr/local/bin:$PATH"
        EOF
    - description: Install pinned Bun system-wide.
      user: "0"
      command: |
        set -eu
        arch=$(dpkg --print-architecture)
        case "$arch" in
          amd64) asset=bun-linux-x64.zip; dir=bun-linux-x64; sha=2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452 ;;
          arm64) asset=bun-linux-aarch64.zip; dir=bun-linux-aarch64; sha=4b1a332ee861983eb93bcfe6f770fff94e3e31b2c388bdaea3c8ed35e58eed0e ;;
          *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/$asset" -o /tmp/bun.zip
        echo "$sha  /tmp/bun.zip" | sha256sum -c -
        unzip -q /tmp/bun.zip -d /tmp/bun
        install -d -m 0755 /opt/bun/bin
        install -m 0755 "/tmp/bun/$dir/bun" /opt/bun/bin/bun
        ln -sf /opt/bun/bin/bun /usr/local/bin/bun
        ln -sf /opt/bun/bin/bun /usr/local/bin/bunx
        BUN_INSTALL=/opt/bun bun install -g @fission-ai/openspec@1.11.0
        ln -sf /opt/bun/bin/openspec /usr/local/bin/openspec
    - description: Install requested JavaScript CLIs, language servers, OpenSpec, and Playwright.
      user: "0"
      command: |
        set -eu
        # bun, not npm: same packages, a fraction of the wall time. --trust
        # runs the lifecycle scripts esbuild and outline-cli need for their
        # platform binaries, which bun otherwise skips.
        BUN_INSTALL=/opt/bun bun install -g --trust \
          @doist/outline-cli@2.0.1 \
          agy-acp@0.5.2 \
          @linear/cli@0.0.5 \
          @shopify/cli@4.7.0 \
          firecrawl-cli@1.23.3 \
          octocode@18.3.0 \
          pyright@1.1.413 \
          typescript@6.0.3 \
          typescript-language-server@6.0.0
        for bin in agy-acp ol lin shopify firecrawl octocode pyright pyright-langserver tsc tsserver typescript-language-server; do
          [ ! -e "/opt/bun/bin/$bin" ] || ln -sf "/opt/bun/bin/$bin" "/usr/local/bin/$bin"
        done
        ln -sf /opt/bun/bin/ol /usr/local/bin/outline
        ln -sf /opt/bun/bin/lin /usr/local/bin/linear
        cat > /usr/local/bin/liquid-language-server <<'EOF'
        #!/bin/sh
        exec shopify theme language-server "$@"
        EOF
        chmod 0755 /usr/local/bin/liquid-language-server
    - description: Install pinned Jina CLI and CodeMap as uv tools.
      user: "0"
      command: |
        set -eu
        command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
        # uv builds the isolated environment, resolves from wheels, and drops
        # entry-point shims into UV_TOOL_BIN_DIR, so no venv, pip or compiler is
        # involved. --python 3.12 pins a standalone CPython rather than trusting
        # whatever the base image ships to satisfy these two.
        export UV_TOOL_DIR=/opt/uv-tools UV_TOOL_BIN_DIR=/usr/local/bin
        uv tool install --python 3.12 'jina-cli==0.3.0'
        uv tool install --python 3.12 'codemap==0.3.0'
        ln -sf /usr/local/bin/jina /usr/local/bin/jina-cli
    - description: Install pinned cloudflared and Perplexity CLI binaries.
      user: "0"
      command: |
        set -eu
        arch=$(dpkg --print-architecture)
        case "$arch" in
          amd64)
            cloud_asset=cloudflared-linux-amd64
            cloud_sha=fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2
            pplx_asset=pplx-x86_64-linux-gnu.bin
            pplx_sha=5002275d947f9d06ed2e7cdc7a815fd1eadc1ba1eb981995c789e13721b8fffe
            ;;
          arm64)
            cloud_asset=cloudflared-linux-arm64
            cloud_sha=7747d94570fb390cf47dcb4f9555c193c6355cda9793f0d878d9049e5d6a7790
            pplx_asset=pplx-aarch64-linux-gnu.bin
            pplx_sha=31e0355a31eec6e637938372f6463c92f5a5147c4231c208a567bb728d75cde3
            ;;
          *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/2026.8.2/$cloud_asset" -o /tmp/cloudflared
        echo "$cloud_sha  /tmp/cloudflared" | sha256sum -c -
        install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
        curl -fsSL "https://github.com/perplexityai/perplexity-cli/releases/download/v0.2.3/$pplx_asset" -o /tmp/pplx
        echo "$pplx_sha  /tmp/pplx" | sha256sum -c -
        install -m 0755 /tmp/pplx /usr/local/bin/pplx
        ln -sf /usr/local/bin/pplx /usr/local/bin/perplexity-cli
    - description: Install pinned Neovim and AstroNvim for the agent user.
      user: "0"
      command: |
        set -eu
        arch=$(dpkg --print-architecture)
        case "$arch" in
          amd64) asset=nvim-linux-x86_64.tar.gz; dir=nvim-linux-x86_64; sha=bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875 ;;
          arm64) asset=nvim-linux-arm64.tar.gz; dir=nvim-linux-arm64; sha=1aa5ca085249580ae0f91eb14f27ec0919773ff2d99a163d03f3d6c21ac29725 ;;
          *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        curl -fsSL "https://github.com/neovim/neovim/releases/download/v0.12.5/$asset" -o /tmp/nvim.tar.gz
        echo "$sha  /tmp/nvim.tar.gz" | sha256sum -c -
        tar -C /opt -xzf /tmp/nvim.tar.gz
        ln -sf "/opt/$dir/bin/nvim" /usr/local/bin/nvim
        rm -rf /home/agent/.config/nvim
        git clone https://github.com/AstroNvim/template.git /home/agent/.config/nvim
        git -C /home/agent/.config/nvim checkout 49a7161b776f8bc6c23508819ea1ad4e7b359bee
        rm -rf /home/agent/.config/nvim/.git
        chown -R agent:agent /home/agent/.config

    - description: Clone Builder Methods Agent OS for the agent user and expose every script globally.
      user: "0"
      command: |
        set -eu
        git clone https://github.com/buildermethods/agent-os.git /home/agent/agent-os
        git -C /home/agent/agent-os checkout cae8e664fb59a01869718c3151e0f45b7a06a2fb
        chown -R agent:agent /home/agent/agent-os
        ln -sfn /home/agent/agent-os/scripts/project-install.sh /usr/local/bin/agent-os-project-install
        ln -sfn /home/agent/agent-os/scripts/sync-to-profile.sh /usr/local/bin/agent-os-sync-to-profile
        ln -sfn /home/agent/agent-os/scripts/common-functions.sh /usr/local/bin/agent-os-common-functions
        # Upstream scripts source this filename relative to the invoked symlink.
        ln -sfn /home/agent/agent-os/scripts/common-functions.sh /usr/local/bin/common-functions.sh
        su agent -s /bin/bash -c 'agent-os-project-install --help >/dev/null'
        su agent -s /bin/bash -c 'agent-os-sync-to-profile --help >/dev/null'
        command -v agent-os-common-functions >/dev/null
    - description: Install pinned Google Antigravity CLI for amd64 and arm64.
      user: "0"
      command: |
        set -eu
        i=0; while [ ! -e /tmp/sbx-workstation-npm-ready ] && [ "$i" -lt 240 ]; do sleep 0.5; i=$((i + 1)); done
        test -e /tmp/sbx-workstation-npm-ready
        arch=$(dpkg --print-architecture)
        case "$arch" in
          amd64)
            url=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.22-5711547746615296/linux-x64/cli_linux_x64.tar.gz
            sha=40225d4b1f009412e905f0a234ba3d51487038d1ad1b8fa19331c84be55610a01f5b0ad9916fb871151cc45456c6bc30cc0b1ea5dab6c0616bc8fb262bcdd7a9
            ;;
          arm64)
            url=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.22-5711547746615296/linux-arm/cli_linux_arm64.tar.gz
            sha=b37a718330eb5e270e1ca70135bf964a407ba626fbff7537ac58e094ea31bc623e6d216ef197188fe8b5c46e6f57aee64a3b7c9e23fc855cefee43fe434179d3
            ;;
          *) echo "unsupported architecture: $arch" >&2; exit 1 ;;
        esac
        curl -fsSL "$url" -o /tmp/agy.tar.gz
        echo "$sha  /tmp/agy.tar.gz" | sha512sum -c -
        tar -C /tmp -xzf /tmp/agy.tar.gz antigravity
        install -m 0755 /tmp/antigravity /usr/local/bin/agy
        agy --version
        command -v agy-acp >/dev/null
    - description: Configure automatic Git SSH commit and tag signing.
      user: "0"
      command: |
        set -eu
        git config --system gpg.format ssh
        git config --system --unset-all user.signingKey || true
        git config --system commit.gpgSign true
        git config --system tag.gpgSign true
        git config --system gpg.ssh.defaultKeyCommand /home/agent/.config/git/ssh-signing-key-command
        git config --system gpg.ssh.allowedSignersFile /home/agent/.config/git/allowed_signers
        install -d -m 0755 -o agent -g agent /home/agent/.config/git
  startup:

  files:
    - path: /home/agent/.local/bin/gemini
      mode: "0755"
      description: Launch Antigravity in place of the built-in Gemini CLI, translating Gemini's default approval flag.
      content: |
        #!/usr/bin/python3
        import os
        import sys

        launcher = "/home/agent/.local/bin/agy-default"
        arguments = [
            "--dangerously-skip-permissions" if argument == "--yolo" else argument
            for argument in sys.argv[1:]
        ]
        os.execv(launcher, [launcher, *arguments])
    - path: /home/agent/.local/bin/agy-default
      mode: "0755"
      description: Start Antigravity CLI with Gemini 3.1 Pro High and high effort.
      content: |
        #!/bin/bash
        python3 /home/agent/.local/bin/install-observability-hooks agy || true
        python3 /home/agent/.local/bin/agent-observe-hook --flush >/dev/null 2>&1 || true
        exec /usr/local/bin/agy --model gemini-3.1-pro-high --effort high "$@"
    - path: /home/agent/.gemini/antigravity-cli/settings.json
      mode: "0644"
      description: Select direct Gemini API-key authentication when the Google service credential is configured.
      content: |
        {
          "modelProvider": "gemini"
        }
    - path: /home/agent/.config/git/ssh-signing-key-command
      mode: "0755"
      description: Select the first forwarded SSH key for Git signing.
      content: |
        #!/bin/sh
        set -e
        if [ -z "$SSH_AUTH_SOCK" ]; then
          SSH_AUTH_SOCK=$(tr '\0' '\n' < /proc/1/environ | grep -m1 '^SSH_AUTH_SOCK=' | cut -d= -f2- || true)
          export SSH_AUTH_SOCK
        fi
        key=$(ssh-add -L 2>/dev/null | head -n 1)
        [ -n "$key" ] || { echo "[git-ssh-sign] no key in forwarded SSH agent" >&2; exit 1; }
        email=$(git config user.email 2>/dev/null || printf '%s' agent@sandbox.local)
        printf '%s %s\n' "$email" "$key" > /home/agent/.config/git/allowed_signers
        printf 'key::%s\n' "$key"
